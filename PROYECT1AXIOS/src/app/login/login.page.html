<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper">

    <div class="panel-marca">
      <svg class="linea-decorativa" viewBox="0 0 260 400" fill="none">
        <path
          #pathRef
          d="M20 380 L20 200 L130 200 L130 20 L240 20"
          stroke="#2C5AA0"
          stroke-width="2"
          stroke-dasharray="530 1386"
          stroke-dashoffset="0"
        />
      </svg>
      <h1 class="marca-nombre">Acme <span>Servicios</span></h1>
      <p class="marca-tagline">Portal de administración de contactos</p>
    </div>

    <div class="panel-form">
      <h2>Iniciar sesión</h2>
      <p class="subtitulo">Ingresa tus credenciales para acceder al panel.</p>

      <form (submit)="handleLogin($event)">
        <label for="email">Correo</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" required placeholder="tucorreo@acme.com">

        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" required placeholder="••••••••">

        <p class="error" *ngIf="error">{{ error }}</p>

        <button type="submit" class="boton-login">Entrar</button>
      </form>
    </div>

  </div>
</ion-content>
