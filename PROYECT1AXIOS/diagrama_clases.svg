<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#1e1e1e"/>

  <!-- Contacto -->
  <rect x="40" y="40" width="260" height="230" rx="8" fill="#2b2b2b" stroke="#6b9bd1" stroke-width="2"/>
  <rect x="40" y="40" width="260" height="34" rx="8" fill="#3a5a8c"/>
  <text x="170" y="63" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">Contacto</text>
  <line x1="40" y1="74" x2="300" y2="74" stroke="#6b9bd1"/>
  <text x="55" y="94" fill="#e0e0e0" font-size="12">+ id: number</text>
  <text x="55" y="114" fill="#e0e0e0" font-size="12">+ nombre: string</text>
  <text x="55" y="134" fill="#e0e0e0" font-size="12">+ empresa: string</text>
  <text x="55" y="154" fill="#e0e0e0" font-size="12">+ email: string</text>
  <text x="55" y="174" fill="#e0e0e0" font-size="12">+ telefono: string</text>
  <text x="55" y="194" fill="#e0e0e0" font-size="12">+ mensaje: string</text>
  <text x="55" y="214" fill="#e0e0e0" font-size="12">+ created_at: string</text>
  <text x="55" y="234" fill="#e0e0e0" font-size="12">+ updated_at: string</text>

  <!-- ContactoService -->
  <rect x="340" y="110" width="300" height="240" rx="8" fill="#2b2b2b" stroke="#8fbf6f" stroke-width="2"/>
  <rect x="340" y="110" width="300" height="34" rx="8" fill="#4a7a3a"/>
  <text x="490" y="133" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">ContactoService</text>
  <line x1="340" y1="144" x2="640" y2="144" stroke="#8fbf6f"/>
  <text x="355" y="164" fill="#e0e0e0" font-size="12">+ obtenerContactos(): Contacto[]</text>
  <text x="355" y="184" fill="#e0e0e0" font-size="12">+ obtenerContacto(id): Contacto</text>
  <text x="355" y="204" fill="#e0e0e0" font-size="12">+ crearContacto(c): Contacto</text>
  <text x="355" y="224" fill="#e0e0e0" font-size="12">+ actualizarContacto(id, c): Contacto</text>
  <text x="355" y="244" fill="#e0e0e0" font-size="12">+ actualizarContactoParcial(id, c)</text>
  <text x="355" y="264" fill="#e0e0e0" font-size="12">+ eliminarContacto(id): void</text>

  <!-- ApiPHP -->
  <rect x="700" y="140" width="160" height="180" rx="8" fill="#2b2b2b" stroke="#d1a76b" stroke-width="2"/>
  <rect x="700" y="140" width="160" height="34" rx="8" fill="#8c6a3a"/>
  <text x="780" y="163" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">API PHP</text>
  <line x1="700" y1="174" x2="860" y2="174" stroke="#d1a76b"/>
  <text x="712" y="194" fill="#e0e0e0" font-size="12">GET index.php</text>
  <text x="712" y="214" fill="#e0e0e0" font-size="12">POST index.php</text>
  <text x="712" y="234" fill="#e0e0e0" font-size="12">PUT index.php</text>
  <text x="712" y="254" fill="#e0e0e0" font-size="12">PATCH index.php</text>
  <text x="712" y="274" fill="#e0e0e0" font-size="12">DELETE index.php</text>

  <!-- Relaciones -->
  <line x1="300" y1="150" x2="340" y2="150" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="140" fill="#aaa" font-size="11">usa</text>

  <line x1="640" y1="230" x2="700" y2="230" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="648" y="220" fill="#aaa" font-size="11">Axios</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#aaa"/>
    </marker>
  </defs>

  <text x="450" y="400" fill="#888" font-size="12" text-anchor="middle">Diagrama de clases — Modelo Contacto / ContactoService / API PHP</text>
</svg>
